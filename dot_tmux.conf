# Use a familiar prefix while preserving the original as a send-prefix binding.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Terminal behavior and scrollback.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on

# Windows and panes are numbered from 1 and stay compact after closing one.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi-style controls where tmux offers an interactive mode.
set -g status-keys vi
setw -g mode-keys vi

# Open windows and panes in the current working directory.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes without first entering prefix mode.
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Copy selected text to the macOS clipboard from copy mode.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Reload after editing the configuration.
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"
